<div class="head">
  <h1>المنتجات</h1>
  <p-button
    label="اضف منتج"
    icon="pi pi-plus"
    [rounded]="true"
    severity="info"
    (click)="showDialog()"
  />
</div>

<p-dialog
  header="اضف منتج"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '25rem', height: '25rem' }"
>
  <div class="flex items-center gap-4 mb-10">
    <label for="username" class="font-semibold w-24">اسم</label>
    <input pInputText id="username" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex items-center gap-4 mb-8">
    <label for="categories" class="font-semibold w-24">النوع</label>
    <p-select [options]="categories" [editable]="true" class="w-full md:w-56" />
  </div>
  <div class="flex justify-end gap-2">
    <p-button label="اغلق" severity="secondary" (click)="visible = false" />
    <p-button label="احفظ" (click)="visible = false" />
  </div>
</p-dialog>

<p-table [value]="products">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Name</th>
      <th>Category</th>
      <th>Quantity</th>
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      <td>{{ product.code }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.category }}</td>
      <td>{{ product.quantity }}</td>
    </tr>
  </ng-template>
</p-table>
